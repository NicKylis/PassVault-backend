name: CI - Passvault

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      MONGO_URI: ${{ secrets.MONGO_URI }}
    steps:
      - name: Install libssl1.1
        run: |
          sudo add-apt-repository "deb http://security.ubuntu.com/ubuntu focal-security main"
          sudo apt-get update
          sudo apt-get install -y libssl1.1

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run AVA tests with coverage
        run: npm run test:coverage

      - name: Start API
        run: |
          npm run dev &
          for i in {1..20}; do
            curl -s http://localhost:5000/health && exit 0
            sleep 2
          done
          echo "API failed to start"
          exit 1

      - name: k6 tests
        run:  |
          sudo snap install k6
          cd k6
          k6 run AuthLoadTest.js
          k6 run AuthSpike.js
          k6 run PasswordDelLoadTest.js
          k6 run PasswordSpite.js
          cd ..

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Render
        run: curl -X POST "$RENDER_DEPLOY_HOOK"
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
